zilisp = "閉じるだけ（それまでに書いた内容が残る。Phase 23）。ただし :if-exists :rename・:rename-and-delete で退避したファイルは元に戻す（Phase 23 のレビュー）"
clhs = "close（:abort が真なら、ストリームを作った副作用を元に戻そうと「試みる」。どこまで戻すかは処理系依存）"
