[[items]]
id = "synonym-file-position"
description = "synonym ストリームを通した file-position（ファイルの入力ストリームを指すとき）"
sbcl = "読んだ文字の数ではなく、内部のバッファの終わりの位置を返す（例：4 バイトのファイルで read-char の後に 4）"
zilisp = "指している先のストリームの今の位置（例：read-char の後に 1。直接のストリームの file-position と同じ。Phase 23 のレビュー）"
clhs = "file-position（ファイルの中の今の位置を返す。※synonym を通した場合の規定は原文では未確認）"
