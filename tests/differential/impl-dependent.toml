description = "BOA の構築子の &aux に、初期値なしで書いた変数のスロットの値"
sbcl = "未束縛の印（印字すると #<unbound>）"
zilisp = "NIL（Phase 26）"
clhs = "3.4.6 Boa Lambda Lists（初期値のない &aux の変数のスロットは初期化されず、読んだ結果は未定義。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "defstruct-slot-type-error-expected-type"
description = "構造体のスロットの :type に合わない値の type-error の expected-type"
sbcl = "正規化した型指定子（(integer 0 10) は (MOD 11)）"
zilisp = "defstruct に書いた型指定子そのまま（Phase 26）。まだ定義していない型・特殊化した配列の要素の型・(complex 型)・satisfies を含む型は検査しない"
clhs = "defstruct（:type に合わない値を入れた結果は未定義。検査するかは処理系依存。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "defstruct-literal-in-compiled-file"
description = "コンパイルするファイル（ネイティブ）の中の構造体のリテラル #S(…)"
sbcl = "make-load-form のメソッドがあれば書き出せる（なければ compile-file でエラー）"
zilisp = "コンパイル時にエラー（構造体のリテラルは、定義を実行した後に読むとき（--script・REPL・read）だけ使える。Phase 26）"
clhs = "3.2.4.4 Additional Constraints on Externalizable Objects、make-load-form（※原文は未確認）"
since = "Phase 26"

[[items]]
id = "sharp-s-nested-labels"
description = "入れ子の #n= のラベルで互いを指す、型のあるスロットの #S（#1=#S(n :next (#2=#S(n :next (#1#))))、#1=(#2=#S(n :next (#1#)) #2#)）"
sbcl = "type-error（ラベルが解決する前の値で型を検査すると推測される。※推測です）"
zilisp = "すべてのラベルが解決した後の値が型に合えば読める（合わなければ、解決した時点で type-error。Phase 26）"
clhs = "2.4.8.15 Sharpsign Equal-Sign・2.4.8.13 Sharpsign S（型を検査する時期は規定されていない。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "sharp-s-escaped-from-reader-macro"
description = "reader macro が、読んだ #S の構造体を別の場所に保存して別の値を返したときの、その構造体の中の #n#（#1=(a $#S(s :x #1#))。$ は保存して NIL を返す）"
sbcl = "置き換えない（スロットに内部の印が残る。型のあるスロットでも受理する）"
zilisp = "ラベルの値に置き換え、スロットの型に合わなければ type-error（仮の値を残さない。Phase 26）"
clhs = "2.4.8.15 Sharpsign Equal-Sign・2.4.8.16 Sharpsign Sharpsign（読んだ結果の外のオブジェクトの扱いは規定されていない。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "sharp-s-copied-by-reader-macro"
description = "reader macro が、読んだ #S の構造体を複製し、元の構造体だけを正しい値に書き換えて、複製を返したときの、複製のスロットの型（#1=!#S(s :x #1#)。x の型に構造体は合わない）"
sbcl = "type-error"
zilisp = "受理する（reader が型を確かめるのは、reader が #S で作った構造体だけ。reader macro が作った・書き換えた構造体の型は reader macro の責任。複製を返すだけで元を書き換えない形は、元の構造体の検査で type-error になる。Phase 26。2026-11-11 の決定）"
clhs = "2.4.8.13 Sharpsign S・2.4.8.15 Sharpsign Equal-Sign（reader macro が返す値の型の検査は規定されていない。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "sharp-equal-alias-of-pending-label"
description = "未解決の #n= のラベルの中で付けた別名を、後ろで参照したときの値（(#1=(#2=#1#) #2#) の #2#）"
sbcl = "#1 のオブジェクトにならない（内部の印が残る。(eq (car v) (cadr v)) は偽）"
zilisp = "#1 のオブジェクトになる（#1 が解決したとき、同じ仮の値を持つ別名の項目も解決した値にする。Phase 26）"
clhs = "2.4.8.15 Sharpsign Equal-Sign・2.4.8.16 Sharpsign Sharpsign（#n# は #n= が付いたオブジェクトを指す。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "sharp-s-large-in-pending-label"
description = "未解決の #n= のラベルの中の #S が 4,096 個より多くのオブジェクトを持つときの、スロットの型のエラーの時期"
sbcl = "#S を読んだその場で type-error"
zilisp = "ラベルを読み終えた時点で type-error（必ず通知する。その間に後ろの #. が評価されることがある。仮の値があるかを調べきれないので、検査を後に回す。Phase 26。2026-11-11 の決定）"
clhs = "2.4.8.13 Sharpsign S（型を検査する時期は規定されていない。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "recursive-read-in-handler"
description = "読み取りの途中のエラーの handler の中の recursive な read（(read s t nil t)）が、外側の #n= のラベルを参照できるか"
sbcl = "参照できる"
zilisp = "参照できない（reader-error。handler には読み取りの途中の状態を引き継がない。#S の型のエラーでも #. の中のエラーでも同じ。Phase 25 からの制限）"
clhs = "read（recursive-p の意味。handler の中での扱いは規定されていない。※原文は未確認）"
since = "Phase 25"

[[items]]
id = "defstruct-include-bare-slot-name"
description = ":include のスロットの書き換えに、裸のシンボルを書いた形（(:include base x)）"
sbcl = "エラー（リストを求める）"
zilisp = "受け付ける（(x) と同じ：元の初期値・型のまま。Phase 26）"
clhs = "defstruct（:include の slot-description は本体と同じ構文。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "local-time-zone-source"
description = "decode-universal-time・encode-universal-time が time-zone なしで使う、その土地の時刻との差の求め方"
sbcl = "C ライブラリの localtime（Windows は負の時刻を 0 として扱う。Unix は環境変数 TZ に従う）"
zilisp = "Windows は SystemTimeToTzSpecificLocalTime（その年の夏時間の規則）、それ以外は /etc/localtime の切り替わりの表（環境変数 TZ は見ない。読めなければ UTC）。32 ビットの time_t の範囲の外の年は、SBCL と同じく 2035 年・1903 年の規則を使う"
clhs = "25.1.4.1 Decoded Time（その土地の時刻との差と夏時間は処理系依存。※原文は未確認）"
since = "Phase 26"

[[items]]
id = "comma-as-list"
description = "backquote の中のコンマの表し方と、内部のシンボル zl-sys:unquote・zl-sys:unquote-splicing・zl-sys:unquote-nsplicing を直接書いたリストの扱い"
sbcl = "コンマは専用のオブジェクト（ふつうのリストとは別のもの）"
zilisp = "コンマはふつうのリスト (zl-sys:unquote x)・(zl-sys:unquote-splicing x)・(zl-sys:unquote-nsplicing x)。これらのシンボルを直接書いたリストは、コンマを書いたのと同じに扱う：backquote の中では展開され（`(a (zl-sys:unquote b)) は `(a ,b) と同じ）、ドットのすぐ後の (zl-sys:unquote-splicing x)・(zl-sys:unquote-nsplicing x) は `(a . ,@x) と同じく reader-error（Phase 26。Codex のレビュー 15 回目。直さないと決めた）"
clhs = "2.4.6 Backquote（backquote の読み取りの結果の表し方は処理系依存。※原文は未確認）"
since = "Phase 26"
