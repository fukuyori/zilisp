# SBCL と Zilisp で結果が異なるが、CLHS で処理系依存・未定義とされているため差分試験から除外する項目
# （詳細設計 §13.1）。根拠となる CLHS の節を必ず書く。

[[items]]
id = "char-case-titlecase"
description = "大文字でも小文字でもないのに、大文字と小文字の対応を持つ4文字（U+01C5 ǅ、U+01C8 ǈ、U+01CB ǋ、U+01F2 ǲ。タイトルケース）の both-case-p・char-upcase・char-downcase・char-equal"
sbcl = "大文字・小文字のある文字とする（both-case-p は T、(char-upcase ǅ) は Ǆ、(char-downcase ǅ) は ǆ。upper-case-p と lower-case-p は NIL。(char-equal ǅ ǆ) は T だが (char-equal ǆ ǅ) は NIL。(equalp #\ǅ #\ǆ) は T）"
zilisp = "大文字・小文字のない文字とする（both-case-p は NIL、char-upcase・char-downcase はそのまま返す。Phase 21.5）。ほかの文字（全符号位置）は SBCL 2.6.7 と同じ（src/unicode/unicode.zig の試験）"
clhs = "13.1.4.3 Characters With Case（大文字・小文字のある文字は大文字か小文字のどちらかで、反対の文字と1対1に対応する）、char-upcase（小文字でなければそのまま返す）"
since = "Phase 21.5"

[[items]]
id = "reader-number-non-ascii-digits"
description = "ASCII 以外の10進数字（U+0661 ١ など）だけからなるトークンを数として読むか"
sbcl = "読む（(read-from-string \"١٢\") は 12）"
zilisp = "読まない（シンボルになる）。digit-char-p と parse-integer は SBCL 2.6.7 と同じく数字とみなす（Phase 21.5）"
clhs = "2.3.1 Numbers as Tokens、2.1.4.2 Constituent Traits（※標準の文字以外の構成文字の性質は処理系に任されると推測される。原文では未確認）"
since = "Phase 21.5"

[[items]]
id = "reader-symbol-normalization"
description = "シンボル名を読むときに Unicode の正規化（NFKC）を行うか"
sbcl = "行う（readtable の normalization。例：ǅ は NFKC で D と ž の2文字になり、大文字にして DŽ。正規化で変わる文字を含む名前は |ǅ| のように囲んで印字する）"
zilisp = "行わない（大文字への変換だけ。ǅ はそのまま読み、囲まずに印字する。Phase 21.5）"
clhs = "2.1.4 Character Syntax Types、23.1.2 Effect of Readtable Case on the Lisp Reader（正規化は CLHS にない SBCL の拡張）"
since = "Phase 21.5"

[[items]]
id = "hash-table-rehash-threshold-order"
description = ":rehash-threshold に 1 以外を指定したハッシュ表で、remhash の後に入れた項目の maphash の順序"
sbcl = "flat の表の続け方が、ソース（target-hash-table.lisp の grow-hash-table）から読める規則と合わない（例：(make-hash-table :rehash-threshold 0.25) は flat のまま大きくなる）"
zilisp = ":rehash-threshold は型を検査し、:size を省いた flat の表の初めの枠の数（大きさ / threshold から決めるバケット数）にだけ使う。既定の大きさで 0.5 を指定した場合は SBCL と同じ順序。ほかは違うことがある。:rehash-threshold を指定しない表と、:rehash-size を指定した表は SBCL と同じ（Phase 21.6）"
clhs = "18.1 Hash Table Concepts、maphash（順序は規定されていない）、make-hash-table（※rehash-size・rehash-threshold は処理系への目安で、無視してもよいと推測される。原文では未確認）"
since = "Phase 21.6"

[[items]]
id = "cl-user-use-list"
description = "COMMON-LISP-USER が use するパッケージ"
sbcl = "COMMON-LISP、SB-ALIEN、SB-DEBUG、SB-EXT、SB-GRAY、SB-PROFILE"
zilisp = "COMMON-LISP だけ（詳細設計 §8.3。教材のコードと拡張機能の名前の衝突を避ける）"
clhs = "11.1.2.2 The COMMON-LISP-USER Package（ほかに use するパッケージは処理系定義）"
since = "Phase 22"

[[items]]
id = "package-error-restarts"
description = "名前の衝突・削除する前の unuse など、package-error からの続行"
sbcl = "restart（continue・take-new など）で続行できる。既にあるパッケージへの defpackage で、前の設定との違いを警告する"
zilisp = "restart はない（condition の Phase 25 で加える）。delete-package は、ほかのパッケージが use していれば package-error。defpackage の違いの警告は出さず、設定を足す"
clhs = "11.1.1.2.5 Prevention of Name Conflicts in Packages（correctable error）、delete-package、defpackage（既にあるパッケージとの違いは処理系に任される）"
since = "Phase 22"

[[items]]
id = "package-variable-type"
description = "*package* にパッケージでない値を束縛・代入したとき"
sbcl = "束縛・代入の時点で type-error"
zilisp = "束縛・代入はでき、その後で読み取るときに読み取りのエラー（関数の既定のパッケージとして使うときは type-error）"
clhs = "*package*（値はパッケージでなければならない。そうでないときの結果は規定されていない）"
since = "Phase 22"

