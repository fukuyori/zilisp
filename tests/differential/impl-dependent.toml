# SBCL と Zilisp で結果が異なるが、CLHS で処理系依存・未定義とされているため差分試験から除外する項目
# （詳細設計 §13.1）。根拠となる CLHS の節を必ず書く。

[[items]]
id = "reader-upcase-non-ascii"
description = "readtable-case が :upcase のとき、ASCII 以外の文字（é、λ など）を大文字に変換するか"
sbcl = "変換する（é → É、λ → Λ）"
zilisp = "変換しない（Phase 03 時点。src/reader/syntax.zig の upcase）"
clhs = "13.1.4.3 Characters With Case（標準の文字以外の大文字小文字は処理系定義）、23.1.2 Effect of Readtable Case on the Lisp Reader"
since = "Phase 03"

[[items]]
id = "reader-character-unicode-names"
description = "#\\ の後の Unicode の文字名（#\\GREEK_SMALL_LETTER_LAMDA など）"
sbcl = "読める"
zilisp = "標準・準標準の名前（Space、Newline、Tab、Page、Return、Linefeed、Backspace、Rubout、Nul）と U+XXXX だけを読む。それ以外の名前は reader-error"
clhs = "13.1.7 Character Names（標準以外の名前は処理系定義）"
since = "Phase 04"

[[items]]
id = "reader-backquote-representation"
description = "backquote を読んだ結果の表現"
sbcl = "(SB-INT:QUASIQUOTE ...) と、コンマを表す構造体"
zilisp = "(ZILISP-SYSTEM:QUASIQUOTE ...)、(ZILISP-SYSTEM:UNQUOTE x)、UNQUOTE-SPLICING、UNQUOTE-NSPLICING"
clhs = "2.4.6 Backquote（読んだ結果の具体的な形は処理系依存）"
since = "Phase 04"

[[items]]
id = "features"
description = "*features* の内容"
sbcl = ":ANSI-CL、:SBCL、:WIN32 など"
zilisp = ":ZILISP、:COMMON-LISP、:64-BIT、:IEEE-FLOATING-POINT、エンディアン、CPU（:X86-64 / :ARM64）、OS（:WINDOWS と :WIN32、:UNIX と :LINUX / :DARWIN）。完全な ANSI 準拠を表明しないため :ANSI-CL は入れない（src/reader/features.zig）"
clhs = "1.5.2.1 Use of Implementation-Defined Language Features、*features*"
since = "Phase 04"

[[items]]
id = "printer-non-ascii-symbol-escape"
description = "ASCII 以外の小文字を含むシンボル名の印字（é など）"
sbcl = "|é| のように囲む（SBCL の Reader は é を大文字に変換するため）"
zilisp = "囲まない（Zilisp の Reader は ASCII だけを大文字に変換するので、é のまま読み戻せる）"
clhs = "22.1.3.3.1 Package Prefixes for Symbols、13.1.4.3 Characters With Case"
since = "Phase 05"

[[items]]
id = "printer-character-names"
description = "名前のない文字（制御文字、Unicode の文字）の印字"
sbcl = "#\\Soh、#\\Esc、#\\GREEK_SMALL_LETTER_LAMDA のような名前"
zilisp = "制御文字は #\\U+1 のような形、それ以外の文字は #\\λ のように文字そのもの（Zilisp の Reader で読み戻せる形）"
clhs = "22.1.3.2 Printing Characters、13.1.7 Character Names"
since = "Phase 05"

[[items]]
id = "printer-denormal-float-digits"
description = "非正規化数の single-float の桁数（例：1.0e-45 として読んだ値）"
sbcl = "1.4012985e-45"
zilisp = "1.0e-45（読み戻せる最短の桁数）"
clhs = "22.1.3.1.3 Printing Floats（読み戻せればよく、桁数は規定されていない）"
since = "Phase 05"

[[items]]
id = "fixnum-range"
description = "most-positive-fixnum / most-negative-fixnum"
sbcl = "2^62-1 / -2^62（x86-64）"
zilisp = "2^61-1 / -2^61（詳細設計 §2.1。値の下位2ビットをタグに使うため）"
clhs = "most-positive-fixnum（処理系依存。少なくとも 2^15-1）"
since = "Phase 05"

[[items]]
id = "reader-double-colon-keyword"
description = "::name の読み取り"
sbcl = "キーワード :NAME として読む"
zilisp = "SBCL と同じくキーワードとして読む"
clhs = "2.3.5 Valid Patterns for Tokens（::name は規定されていない）"
since = "Phase 03"

[[items]]
id = "implementation-limits"
description = "処理系の上限を表す定数の値"
sbcl = "most-positive-fixnum 4611686018427387903（2^62-1）、call-arguments-limit・lambda-parameters-limit・multiple-values-limit 1073741824"
zilisp = "most-positive-fixnum 2305843009213693951（2^61-1。詳細設計 §2.2）、call-arguments-limit 65536、lambda-parameters-limit 1024、multiple-values-limit 1024（§6.7）"
clhs = "most-positive-fixnum、call-arguments-limit、lambda-parameters-limit、multiple-values-limit の各定数の定義（値は処理系依存。下限だけが決められている）"
since = "Phase 13"

[[items]]
id = "make-array-initial-element"
description = "make-array で :initial-element・:initial-contents を指定しないときの要素の値"
sbcl = "要素の型が T なら 0、文字なら #\\Nul"
zilisp = "SBCL 2.6.7 と同じ（T なら 0、文字なら #\\Nul）"
clhs = "make-array（初期値を指定しない場合、要素の値は未定義）"
since = "Phase 16"

[[items]]
id = "fixnum-width"
description = "fixnum の範囲（most-positive-fixnum・most-negative-fixnum）"
sbcl = "63 ビット（4611686018427387903）"
zilisp = "62 ビット（2305843009213693951。詳細設計 §2.2 のタグの割り当て）"
clhs = "12.1.1 Numeric Operations、most-positive-fixnum（fixnum の範囲は処理系定義。少なくとも 16 ビット）"
since = "Phase 20"

[[items]]
id = "transcendental-last-bit"
description = "超越関数（exp・log・sin など）の double-float の結果の最後のビット"
sbcl = "C の数学ライブラリの結果（例：(exp 1d0) → 2.718281828459045d0）"
zilisp = "Zig の実装の結果（例：(exp 1d0) → 2.7182818284590455d0。誤差は 1 ulp 未満）"
clhs = "※超越関数の浮動小数の結果の精度の規定はないと推測される（CLHS の原文では未確認）"
since = "Phase 20"

[[items]]
id = "string-case-non-ascii"
description = "string-upcase・string-downcase・string-capitalize・char-upcase・char-downcase が ASCII 以外の文字を変換するか。char-equal・string-equal・equalp が ASCII 以外の文字の大文字・小文字を区別しないか"
sbcl = "変換する（例：(char-upcase (code-char 224)) は (code-char 192)。(char-equal (code-char 192) (code-char 224)) は T）"
zilisp = "変換しない・区別する（Phase 19・21。Reader と同じ）"
clhs = "13.1.4.3 Characters With Case（標準の文字以外の大文字小文字は処理系定義）"
since = "Phase 19"

[[items]]
id = "char-class-non-ascii"
description = "alpha-char-p・alphanumericp・upper-case-p・lower-case-p・both-case-p・digit-char-p が ASCII 以外の文字を英字・数字とみなすか"
sbcl = "みなす（例：(alpha-char-p (code-char 12354)) は T、(digit-char-p (code-char 65297)) は 1、(upper-case-p (code-char 192)) は T）"
zilisp = "みなさない（ASCII の英字・数字だけ。Phase 21）"
clhs = "13.1.4 Character Categories（※標準の文字以外の分類は処理系に任されると推測される。原文では未確認）"
since = "Phase 21"

[[items]]
id = "print-subnormal-float"
description = "非正規化数の浮動小数の印字の桁数"
sbcl = "正規化数と同じ桁数で書く（例：最小の正の single-float は 1.4012985e-45）"
zilisp = "読み戻せる最短の桁で書く（例：1.0e-45）。どちらも読み戻すと同じ値になる"
clhs = "22.1.3.1.3 Printing Floats（※読み戻して同じ値になればよく、桁数は処理系に任されると推測される。原文では未確認）"
since = "Phase 05（Phase 20 のレビューで確認）"
